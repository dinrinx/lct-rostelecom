# Конфиг Garage (S3-совместимое хранилище) для docker-compose стенда.
# rpc_secret/admin_token НЕ заданы здесь намеренно: Garage подставляет их из
# переменных окружения GARAGE_RPC_SECRET/GARAGE_ADMIN_TOKEN (см. сервис
# "storage" в docker-compose.yml, значения — в infra/.env), это и есть
# единственное место, где эти секреты реально хранятся при деплое.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
# Имя сервиса в docker-compose, а не localhost — init-контейнер общается
# с этим же узлом через сеть compose, а не через docker exec/shared netns.
rpc_public_addr = "storage:3901"

[s3_api]
# Важно: наш backend (storage/minio.service.ts) должен передавать этот же
# регион (MINIO_REGION=garage в .env) — иначе Garage отклоняет подпись
# запроса как "unexpected scope" (в отличие от MinIO/scality, Garage реально
# сверяет регион).
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
