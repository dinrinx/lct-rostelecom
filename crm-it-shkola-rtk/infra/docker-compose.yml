services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm_it_shkola_rtk
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm_it_shkola_rtk"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # minio/minio закрыт на Docker Hub без логина (pull access denied) — замена
  # на scality/s3server: тот же S3 API (мы говорим с ним через npm-пакет
  # `minio`, который просто S3-клиент — от S3-сервера ему нужен только
  # совместимый REST+SigV4, реализация неважна). Порт 8000 — дефолтный для
  # этого образа; backend/.env(.example) MINIO_PORT указывает на него же.
  storage:
    image: scality/s3server:latest
    restart: unless-stopped
    environment:
      SCALITY_ACCESS_KEY_ID: crm-minio
      SCALITY_SECRET_ACCESS_KEY: crm-minio-secret
    ports:
      - "8000:8000" # S3 API
    volumes:
      - storage-data:/usr/src/app/localData
      - storage-metadata:/usr/src/app/localMetadata

  # Realm it-school-crm импортируется из infra/keycloak/realm-export.json при каждом
  # старте контейнера (--import-realm). Образ quay.io/keycloak/keycloak — Quarkus-дистрибутив
  # (Keycloak 17+), поэтому легаси-переменная KEYCLOAK_IMPORT тут не работает: нужно
  # класть файл(ы) в /opt/keycloak/data/import и явно просить импорт флагом команды.
  # Dev-режим бэкенда (AUTH_MODE=dev, заголовок X-Dev-Role) продолжает работать
  # независимо от Keycloak — см. backend/.env.example.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

volumes:
  postgres-data:
  redis-data:
  storage-data:
  storage-metadata:
  keycloak-data:
