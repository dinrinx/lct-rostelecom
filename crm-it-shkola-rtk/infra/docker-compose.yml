services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm_it_shkola_rtk
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm_it_shkola_rtk"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: crm-minio
      MINIO_ROOT_PASSWORD: crm-minio-secret
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web-консоль
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Realm it-school-crm импортируется из infra/keycloak/realm-export.json при каждом
  # старте контейнера (--import-realm). Образ quay.io/keycloak/keycloak — Quarkus-дистрибутив
  # (Keycloak 17+), поэтому легаси-переменная KEYCLOAK_IMPORT тут не работает: нужно
  # класть файл(ы) в /opt/keycloak/data/import и явно просить импорт флагом команды.
  # Dev-режим бэкенда (AUTH_MODE=dev, заголовок X-Dev-Role) продолжает работать
  # независимо от Keycloak — см. backend/.env.example.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

volumes:
  postgres-data:
  redis-data:
  minio-data:
  keycloak-data:
