services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm_it_shkola_rtk
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm_it_shkola_rtk"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # minio/minio закрыт на Docker Hub без логина (pull access denied). Первая
  # замена была на scality/s3server — та тоже завелась, но образ только
  # linux/amd64: на Apple Silicon (M-чипы) Docker гонял её через эмуляцию,
  # и фронтендеры на таких машинах об это спотыкались. Garage (dxflrs/garage)
  # собирается нативно и под arm64, и под amd64 — тот же S3 API, мы говорим
  # с ним через npm-пакет `minio` (обычный S3-клиент, ему всё равно, что за
  # сервер отвечает). Порт 3900 — S3 API Garage; backend/.env(.example)
  # MINIO_PORT/MINIO_REGION указывают на него же.
  #
  # В отличие от MinIO/scality, Garage не создаёт бакет сам по первому
  # запросу — узлу нужен назначенный "layout" кластера, а бакет/ключ доступа
  # заводятся отдельно через его собственный CLI. Это делает соседний
  # сервис storage-init (см. infra/garage/init/init.sh) — безопасно
  # перезапускаемый, ничего не ломает при повторных `docker compose up`.
  storage:
    image: dxflrs/garage:v1.0.1
    restart: unless-stopped
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - storage-meta:/var/lib/garage/meta
      - storage-data:/var/lib/garage/data
    ports:
      - "3900:3900" # S3 API

  storage-init:
    build: ./garage/init
    restart: "no"
    network_mode: "service:storage"
    depends_on:
      - storage
    environment:
      GARAGE_KEY_ID: GK8533518c26b556bb9a9dde7d
      GARAGE_SECRET_KEY: 3918d67710daeb39d6d1b2cd780ae56b7eaa61d884dd0050163a0660dc4d3b88
      GARAGE_BUCKET: crm-attachments
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - storage-meta:/var/lib/garage/meta
      - storage-data:/var/lib/garage/data

  # Realm it-school-crm импортируется из infra/keycloak/realm-export.json при каждом
  # старте контейнера (--import-realm). Образ quay.io/keycloak/keycloak — Quarkus-дистрибутив
  # (Keycloak 17+), поэтому легаси-переменная KEYCLOAK_IMPORT тут не работает: нужно
  # класть файл(ы) в /opt/keycloak/data/import и явно просить импорт флагом команды.
  # Dev-режим бэкенда (AUTH_MODE=dev, заголовок X-Dev-Role) продолжает работать
  # независимо от Keycloak — см. backend/.env.example.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

volumes:
  postgres-data:
  redis-data:
  storage-data:
  storage-meta:
  keycloak-data:
