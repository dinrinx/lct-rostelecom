# Единая точка входа: домен itschool-rtk-supremum.ru.
# :80 — только ACME-challenge (продление Let's Encrypt) + редирект на https.
# :443 — статика фронтенда (frontend/prototype) + прокси на backend по
# известным префиксам контроллеров (см. backend/src/*/*.controller.ts).

server {
    listen 80;
    listen [::]:80;
    server_name itschool-rtk-supremum.ru www.itschool-rtk-supremum.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name itschool-rtk-supremum.ru www.itschool-rtk-supremum.ru;

    ssl_certificate     /etc/letsencrypt/live/itschool-rtk-supremum.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itschool-rtk-supremum.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 20m;

    # API backend'а — все контроллеры сейчас без общего префикса (см. main.ts),
    # поэтому проксируем по списку известных корневых путей.
    location ~ ^/(admin|auth|health|integrations|workflow|catalogs|dashboard|files|reports|api) {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Статика фронтенда (dc-runtime прототип). Прямых "красивых" путей нет —
    # каждая роль открывает свой шелл-файл явно (CRM.dc.html / Admin.dc.html),
    # поэтому голый "/" отдаём как вход в клиентское приложение КАМ/Руководителя.
    root /usr/share/nginx/html;
    index CRM.dc.html;

    location / {
        try_files $uri $uri/ /CRM.dc.html;
    }
}
